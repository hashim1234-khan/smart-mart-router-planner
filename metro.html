<body>

<header>
  <h1>🚇 Peshawar Metro Route Planner</h1>
  <p>Shortest Path using Dijkstra Algorithm</p>
</header>

<div class="container">
  <label for="start">Start Station</label>
  <select id="start">
    <option value="">Select Station</option>
    <option value="Hayatabad">Hayatabad</option>
    <option value="University">University</option>
    <option value="Saddar">Saddar</option>
    <option value="Hashtnagri">Hashtnagri</option>
    <option value="Babusar">Babusar</option>
  </select>

  <label for="end">Destination Station</label>
  <select id="end">
    <option value="">Select Station</option>
    <option value="Hayatabad">Hayatabad</option>
    <option value="University">University</option>
    <option value="Saddar">Saddar</option>
    <option value="Hashtnagri">Hashtnagri</option>
    <option value="Babusar">Babusar</option>
  </select>

  <button onclick="findShortestRoute()">Find Shortest Route</button>

  <div class="result" id="result"></div>
</div>

<script>
  // Graph representation (distance in minutes)
  const graph = {
    Hayatabad: { University: 10, Saddar: 25 },
    University: { Hayatabad: 10, Saddar: 15, Hashtnagri: 20 },
    Saddar: { Hayatabad: 25, University: 15, Hashtnagri: 10 },
    Hashtnagri: { University: 20, Saddar: 10, Babusar: 15 },
    Babusar: { Hashtnagri: 15 }
  };

  function dijkstra(start, end) {
    const distances = {};
    const previous = {};
    const unvisited = new Set(Object.keys(graph));

    for (let node of unvisited) {
      distances[node] = Infinity;
    }
    distances[start] = 0;

    while (unvisited.size > 0) {
      let current = null;
      for (let node of unvisited) {
        if (current === null || distances[node] < distances[current]) {
          current = node;
        }
      }

      if (current === end) break;
      unvisited.delete(current);

      for (let neighbor in graph[current]) {
        let newDist = distances[current] + graph[current][neighbor];
        if (newDist < distances[neighbor]) {
          distances[neighbor] = newDist;
          previous[neighbor] = current;
        }
      }
    }

    const path = [];
    let curr = end;
    while (curr) {
      path.unshift(curr);
      curr = previous[curr];
    }

    return { path, distance: distances[end] };
  }

  function findShortestRoute() {
    const start = document.getElementById('start').value;
    const end = document.getElementById('end').value;
    const resultDiv = document.getElementById('result');

    if (!start || !end) {
      alert('Please select both stations');
      return;
    }

    if (start === end) {
      resultDiv.style.display = 'block';
      resultDiv.innerHTML = 'You are already at the destination.';
      return;
    }

    const result = dijkstra(start, end);

    resultDiv.style.display = 'block';
    resultDiv.innerHTML = `<strong>Shortest Route:</strong><br>${result.path.join(' → ')}<br><br><strong>Total Time:</strong> ${result.distance} minutes`;
  }
</script>
